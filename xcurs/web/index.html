<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>xcurs</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- The mirror: a sheet of dark glass with a faint sheen. Light from the
       canvas below shows through it, like a display behind a smart mirror. -->
  <div id="glass" aria-hidden="true"></div>
  <canvas id="pad"></canvas>

  <header id="brand">
    <div class="wordmark">xcurs</div>
    <div class="status" id="status"><span class="dot"></span><span class="label">connecting</span></div>
  </header>

  <button id="menu" type="button" aria-label="Settings" aria-expanded="false" aria-controls="sheet">
    <span></span><span></span><span></span>
  </button>

  <div id="sheet" aria-hidden="true">
    <section class="panel glass-panel" role="dialog" aria-label="Settings">
      <div class="grip"></div>
      <h2>settings</h2>

      <label class="row">
        <span class="name">sensitivity</span><output data-out="sens"></output>
        <input type="range" data-key="sens" min="0.4" max="3" step="0.1">
      </label>
      <label class="row">
        <span class="name">acceleration</span><output data-out="accel"></output>
        <input type="range" data-key="accel" min="0" max="2" step="0.1">
      </label>
      <label class="row">
        <span class="name">scroll speed</span><output data-out="scroll"></output>
        <input type="range" data-key="scroll" min="0.3" max="3" step="0.1">
      </label>
      <label class="toggle">
        <span class="name">natural scrolling</span>
        <input type="checkbox" data-key="natural"><span class="switch"></span>
      </label>
      <label class="toggle">
        <span class="name">haptics</span>
        <input type="checkbox" data-key="haptics"><span class="switch"></span>
      </label>

      <div class="actions">
        <button id="reset" type="button" class="ghost">reset</button>
        <button id="done" type="button" class="solid">done</button>
      </div>
    </section>
  </div>

  <button id="kbd" type="button" aria-label="Keyboard" aria-expanded="false" aria-controls="keys">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2.5" y="6" width="19" height="12" rx="2.5" />
      <path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M6.5 13.5h.01M17 13.5h.01M9.5 14h5" />
    </svg>
  </button>

  <div id="keys" aria-hidden="true">
    <section class="glass-panel keyboard" role="dialog" aria-label="Keyboard">
      <div class="keyrow">
        <button type="button" data-key="esc">esc</button>
        <button type="button" data-key="tab">tab</button>
        <button type="button" data-mod="ctrl">ctrl</button>
        <button type="button" data-mod="alt">alt</button>
        <button type="button" data-mod="super">super</button>
      </div>
      <div class="keyrow">
        <button type="button" data-key="left" aria-label="Left">←</button>
        <button type="button" data-key="up" aria-label="Up">↑</button>
        <button type="button" data-key="down" aria-label="Down">↓</button>
        <button type="button" data-key="right" aria-label="Right">→</button>
        <button type="button" data-key="backspace" aria-label="Backspace">⌫</button>
        <button type="button" data-key="enter" aria-label="Enter">⏎</button>
      </div>
      <div class="typing">
        <div class="field empty">
          <textarea id="type" rows="1" autocapitalize="off" autocomplete="off" autocorrect="on"
            spellcheck="true" aria-label="Type on the laptop"></textarea>
          <span class="ph" aria-hidden="true">type here</span>
        </div>
        <button type="button" id="kbd-close" aria-label="Close keyboard">×</button>
      </div>
    </section>
  </div>

  <footer id="hint">
    <span>tap · click</span>
    <span>two-finger tap · right click</span>
    <span>two-finger drag · scroll</span>
    <span>tap, then hold · drag</span>
    <span>three or four fingers · desktop gestures</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
