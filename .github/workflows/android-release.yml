name: Android release

# Two ways to release a signed APK on GitHub Releases:
#   - push a tag like v0.6.0, or
#   - Actions -> Android release -> Run workflow, and type a version (0.6.0):
#     the tag and the release are created for you.
# "Run workflow" with no version just builds the APK as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.6.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write # create the release and upload the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XCURS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xcurs-release.jks"
            echo "XCURS_KEYSTORE=$RUNNER_TEMP/xcurs-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::XCURS_KEYSTORE_BASE64 is not set: signing with a throwaway debug key, so this APK can't update a previous install."
          fi

      - name: Build APK
        env:
          XCURS_KEYSTORE_PASSWORD: ${{ secrets.XCURS_KEYSTORE_PASSWORD }}
          XCURS_KEY_ALIAS: ${{ secrets.XCURS_KEY_ALIAS }}
          XCURS_KEY_PASSWORD: ${{ secrets.XCURS_KEY_PASSWORD }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$TAG' isn't a version like v0.6.0"; exit 1
            fi
            export XCURS_VERSION="${TAG#v}"
            NAME="xcurs-${TAG}.apk"
          else
            NAME="xcurs-${GITHUB_SHA::7}.apk"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          export XCURS_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$NAME"
          echo "APK=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"

      - name: Attach to GitHub Release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK }}
          generate_release_notes: true

      - name: Upload as artifact
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: xcurs-apk
          path: ${{ env.APK }}
