name: Android release

# Push a tag like v0.5.0 to build a signed APK and attach it to a GitHub
# Release. "Run workflow" (manual) builds one too, as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XCURS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xcurs-release.jks"
            echo "XCURS_KEYSTORE=$RUNNER_TEMP/xcurs-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::XCURS_KEYSTORE_BASE64 is not set: signing with a throwaway debug key, so this APK can't update a previous install."
          fi

      - name: Build APK
        env:
          XCURS_KEYSTORE_PASSWORD: ${{ secrets.XCURS_KEYSTORE_PASSWORD }}
          XCURS_KEY_ALIAS: ${{ secrets.XCURS_KEY_ALIAS }}
          XCURS_KEY_PASSWORD: ${{ secrets.XCURS_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export XCURS_VERSION="${GITHUB_REF_NAME#v}"
            NAME="xcurs-${GITHUB_REF_NAME}.apk"
          else
            NAME="xcurs-${GITHUB_SHA::7}.apk"
          fi
          export XCURS_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$NAME"
          echo "APK=$RUNNER_TEMP/$NAME" >> "$GITHUB_ENV"

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true

      - name: Upload as artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: xcurs-apk
          path: ${{ env.APK }}
