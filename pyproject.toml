[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xcurs"
version = "0.8.0"
description = "Your phone, as a touchpad for your Linux laptop."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["evdev>=1.6", "aiohttp>=3.9", "qrcode>=7", "zeroconf>=0.131"]

[project.scripts]
xcurs = "xcurs.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["xcurs*"]

[tool.setuptools.package-data]
xcurs = ["web/*"]
